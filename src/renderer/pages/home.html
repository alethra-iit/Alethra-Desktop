<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' alethra:; img-src * data: blob: alethra:; style-src 'self' alethra: 'unsafe-inline'">
<title>Tab baru</title><link rel="stylesheet" href="alethra://app/shared.css"><style>
:root{--bg:#fff;--surf:#f4f4f6;--fg:#111113;--sub:#6b6b73;--line:#e8e8ec}
:root[data-theme=dark]{--bg:#0b0b0d;--surf:#17171a;--fg:#f4f4f5;--sub:#8e8e96;--line:#26262a}
:root[data-theme=dark][data-amoled]{--bg:#000;--surf:#121214;--line:#1e1e21}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px 24px 32px;background-attachment:fixed}
svg{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.hero{margin-top:9vh;text-align:center}
.hero svg.logo{width:72px;height:72px;stroke-width:2.4;color:var(--acc,var(--fg))}
.hero h1{margin:10px 0 4px;font-size:34px;font-weight:700;letter-spacing:-.5px}
.hero p{margin:0;color:var(--sub);font-size:15px}
.clock{--ck:var(--fg);width:100%;max-width:560px;margin-top:28px;background:var(--surf);border-radius:26px;padding:20px 18px;text-align:center;color:var(--ck)}
.clock.nobg{background:none}
.clock .tm{font-size:calc(52px*var(--z,1));font-weight:700;letter-spacing:-1px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--ck)}
.clock .dt{margin-top:6px;font-size:calc(15px*var(--z,1));color:var(--sub)}
.clock.al-l{text-align:left}.clock.al-r{text-align:right}
.clock.analog,.clock.dial{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:18px 22px 18px 26px;border-radius:30px;min-height:calc(160px*var(--z,1))}
.clock.analog.al-c{justify-content:center;gap:34px}
.clock.analog.al-r{flex-direction:row-reverse;justify-content:space-between;text-align:right}
.clock.analog .tm{font-size:calc(34px*var(--z,1));letter-spacing:-.5px}
.clock.analog .city{margin-top:14px;font-size:calc(16px*var(--z,1));color:var(--sub)}
.clock.analog .dt{margin-top:2px;font-size:calc(16px*var(--z,1));color:var(--fg)}
.clock.dial{justify-content:center;min-height:0;padding:16px}
.clock.dial.al-l{justify-content:flex-start}.clock.dial.al-r{justify-content:flex-end}
svg.clk{width:calc(124px*var(--z,1));height:calc(124px*var(--z,1));flex:none;stroke:none;fill:none}
.clock.dial svg.clk{width:calc(170px*var(--z,1));height:calc(170px*var(--z,1))}
.clk text{fill:var(--ck);font-size:calc(12px*var(--z,1));font-weight:700;text-anchor:middle;dominant-baseline:central;font-family:system-ui,sans-serif}
.clk .h{stroke:var(--ck);stroke-linecap:round;fill:none}
.clk .t{stroke:var(--ck);stroke-linecap:round;fill:none;opacity:.55}
.clk .s{stroke:var(--acc,#f0a030);stroke-linecap:round;fill:none}
.clk circle{fill:var(--acc,#f0a030);stroke:none}
.clock.text{background:none;padding:0 4px;margin-top:24px}
.clock.text .tm{font-size:calc(30px*var(--z,1));letter-spacing:-.5px}
.clock.text .dt{margin-top:2px;font-size:calc(14px*var(--z,1))}
.clock.bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border-radius:26px;margin-top:24px}
.clock.bar.al-l{justify-content:flex-start}.clock.bar.al-r{justify-content:flex-end}
.clock.bar .tm{font-size:calc(26px*var(--z,1));letter-spacing:-.5px}
.clock.bar .dt{margin:0;font-size:calc(15px*var(--z,1))}
.grid{width:100%;max-width:640px;margin-top:34px;display:grid;grid-template-columns:repeat(5,1fr);gap:22px 12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px}
.ic{width:56px;height:56px;border-radius:16px;background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;overflow:hidden}
.ic img{width:30px;height:30px}
.ic svg{width:24px;height:24px;color:var(--fg)}
.lb{font-size:12px;color:var(--fg);max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sbox{width:100%;max-width:600px;margin-top:26px;display:flex;align-items:center;gap:10px;background:var(--surf);border:2px solid transparent;border-radius:28px;padding:0 20px;height:52px}
.sbox:focus-within{border-color:var(--acc,var(--fg))}.sbox svg{width:20px;height:20px;color:var(--sub)}
.sbox input{flex:1;height:100%;border:0;outline:0;background:none;font-size:16px;color:var(--fg)}
.cal{--cz:1;--ck:var(--acc,var(--fg));--cok:var(--onacc,var(--bg));width:100%;max-width:560px;margin-top:20px;background:var(--surf);border-radius:26px;padding:16px 16px 14px;color:var(--fg);font-size:calc(14px*var(--cz))}
.cal.nobg{background:none;padding:4px}
.cal button{font:inherit;color:inherit;cursor:pointer}
.cal svg.i{width:18px;height:18px;flex:none}
.cal .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal .cn{display:flex;align-items:center;gap:2px}
.cal .ct{border:0;background:none;font-size:calc(18px*var(--cz));font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:10px}
.cal .ct svg.i{width:14px;height:14px;color:var(--sub)}
.cal .cb{border:0;background:none;height:32px;min-width:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;font-size:13px}
.cal .cb.td{color:var(--ck);font-weight:600;margin-right:4px}
.cal .ct:hover,.cal .cb:hover{background:var(--line)}
.cal .gd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .gd.wk{grid-template-columns:26px repeat(7,1fr)}
.cal .dh{font-size:calc(12px*var(--cz));color:var(--sub);font-weight:600;padding:4px 0}
.cal .dh.su{color:#e5484d}
.cal .wn{font-size:11px;color:var(--sub);opacity:.7;display:flex;align-items:center;justify-content:center}
.cal .dc{position:relative;height:calc(38px*var(--cz));border:0;background:none;border-radius:12px;font-size:calc(14px*var(--cz));font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.cal .dc:hover{background:var(--line)}
.cal .dc.o{color:var(--sub);opacity:.45}
.cal .dc.su,.cal .dc.hl{color:#e5484d}
.cal .dc.cu{color:#e08a1e}
.cal .dc.sl{box-shadow:inset 0 0 0 2px var(--ck)}
.cal .dc.tdy{background:var(--ck);color:var(--cok);font-weight:700}
.cal .dc.tdy:hover{filter:brightness(1.12)}
.cal .dts{display:flex;gap:3px;height:4px}
.cal .dts i{width:4px;height:4px;border-radius:50%;background:var(--ck)}
.cal .dc.tdy .dts i{background:var(--cok)}
.cal .mp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 0 6px}
.cal .mp button{height:calc(46px*var(--cz));border:0;background:none;border-radius:12px;font-size:calc(14px*var(--cz))}
.cal .mp button:hover{background:var(--line)}
.cal .mp button.sl{box-shadow:inset 0 0 0 2px var(--ck)}
.cal .mp button.tdy{background:var(--ck);color:var(--cok);font-weight:700}
.cal .ag{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.cal .ah{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.cal .ah b{font-size:calc(14px*var(--cz))}
.cal .hc{font-size:12px;padding:2px 9px;border-radius:10px;background:rgba(229,72,77,.15);color:#e5484d}
.cal .hc.cu{background:rgba(224,138,30,.15);color:#e08a1e}
.cal .ei{display:flex;align-items:center;gap:10px;padding:6px 4px 6px 10px;border-radius:10px;border-left:3px solid var(--ck)}
.cal .ei:hover{background:var(--line)}
.cal .et{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:40px}
.cal .ex{flex:1;min-width:0;overflow-wrap:anywhere}
.cal .ei .cb{height:26px;min-width:26px;padding:0;color:var(--sub);opacity:0}
.cal .ei:hover .cb,.cal .ei .cb:focus{opacity:1}
.cal .em{color:var(--sub);font-size:13px;padding:2px 4px 6px}
.cal .ad{display:flex;gap:6px;margin-top:8px}
.cal .ci{height:36px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:0 10px;outline:0;font:inherit;font-size:13px;min-width:0}
.cal .ci:focus{border-color:var(--ck)}
.cal .ci.tm{width:96px;flex:none}.cal #ctx{flex:1}
.cal .ab{height:36px;width:36px;flex:none;border:0;border-radius:10px;background:var(--ck);color:var(--cok);display:flex;align-items:center;justify-content:center}
.cal .up{margin-top:12px;color:var(--sub);font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.cal .ui{width:100%;display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:6px 8px;border-radius:10px;font-size:13px}
.cal .ui:hover{background:var(--line)}
.cal .ui .ud{color:var(--sub);min-width:78px;font-size:12px}
.cal .ui .ux{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal.st-c{padding:12px 14px}.cal.st-c .dc{height:calc(32px*var(--cz))}
.cal.al-r .ch{flex-direction:row-reverse}
.cal.al-c .ch{justify-content:center;gap:6px}.cal.al-c .cn{display:contents}
.cal.al-c .cb[data-a=prev]{order:0}.cal.al-c .ct{order:1}.cal.al-c .cb[data-a=next]{order:2}.cal.al-c .cb.td{order:3;margin:0 0 0 6px}
.cal.al-r .cb.td{margin:0 0 0 4px}
.cal.al-c .ah{justify-content:center}.cal.al-r .ah{justify-content:flex-end}
.cal.m-o .dc.tdy{background:none;color:var(--ck);box-shadow:inset 0 0 0 2px var(--ck)}
.cal.m-o .dc.tdy .dts i,.cal.m-d .dc.tdy .dts i{background:var(--ck)}
.cal.m-d .dc.tdy{background:none;color:var(--ck)}
.cal.m-d .dc.tdy::before{content:"";position:absolute;top:3px;width:16px;height:3px;border-radius:2px;background:var(--ck)}
.cal.m-o .mp button.tdy{background:none;color:var(--ck);box-shadow:inset 0 0 0 2px var(--ck)}.cal.m-d .mp button.tdy{background:none;color:var(--ck)}
.cal span.ct{pointer-events:none}
.cal .ga{display:flex;gap:16px;align-items:flex-start}.cal.al-r .ga{flex-direction:row-reverse}
.cal .gl{flex:none;width:calc(116px*var(--cz));text-align:center;padding:6px 0}
.cal .gdn{font-size:calc(54px*var(--cz));font-weight:700;line-height:1;color:var(--ck);font-variant-numeric:tabular-nums}
.cal .gdw{margin-top:6px;font-size:calc(16px*var(--cz));font-weight:600}
.cal .gdm{font-size:calc(13px*var(--cz));color:var(--sub);margin-bottom:8px}
.cal .gr{flex:1;min-width:0}.cal .ga .ag{margin:0;border:0;padding:0}.cal .ga .up{margin-top:10px}
.cal.st-b{padding:10px 14px;border-radius:22px}
.cal .br{width:100%;border:0;background:none;display:flex;align-items:center;gap:10px;text-align:left;padding:6px 2px;border-radius:12px;font-size:calc(14px*var(--cz))}
.cal .br:hover{background:var(--line)}
.cal .bd{font-weight:700;color:var(--ck);white-space:nowrap}
.cal .bx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
.cal.al-r .br{flex-direction:row-reverse;text-align:right}
.cal.al-c .br{justify-content:center}.cal.al-c .bx{flex:0 1 auto}
.cal.st-b .ag{margin-top:6px}
.tile{position:relative;cursor:pointer}.tile .rm{position:absolute;top:-6px;right:6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--surf);color:var(--sub);font-size:12px;line-height:1;display:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tile:hover .rm{display:block}.tile:hover .ic{filter:brightness(.95)}

/* ===== tata letak widget: baris × 5 kolom ===== */
:root{--gap:16px;--ru:72px}
body{padding:8px 20px 40px}
.wg{position:relative;width:100%;max-width:1180px;margin-top:6vh;display:flex;flex-direction:column;gap:var(--gap)}
.wr{display:flex;justify-content:center;align-items:stretch;gap:var(--gap)}
.w{position:relative;container-type:inline-size;flex:0 0 calc((100% - 4*var(--gap))*var(--w,5)/5 + (var(--w,5) - 1)*var(--gap));min-width:0;min-height:var(--mh,0px);display:flex;flex-direction:column;justify-content:center}
.w>.hero{margin:0;padding:6px 0}
.w>.sbox,.w>.clock,.w>.cal,.w>.grid{margin:0!important;max-width:none;width:100%}
.w>.clock,.w>.cal{flex:1 1 auto}
.w>.clock:not(.analog):not(.dial):not(.bar){display:flex;flex-direction:column;justify-content:center}
.w>.grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));align-content:start;gap:22px 8px}
.wempty{text-align:center;color:var(--sub);padding:40px 0;font-size:15px}
@container (max-width:340px){
  .clock .tm{font-size:calc(38px*var(--z,1))}
  .clock.analog{flex-direction:column-reverse;justify-content:center;text-align:center;gap:10px;padding:16px}
  .clock.analog.al-r{flex-direction:column-reverse}
  .clock.analog .tm{font-size:calc(28px*var(--z,1))}
  .clock.text .tm,.clock.bar .tm{font-size:calc(24px*var(--z,1))}
  .clock.bar{flex-wrap:wrap}
}
@media (max-width:719px){
  body{padding:8px 12px 32px}
  .wg{margin-top:3vh}
  .wr{flex-direction:column;align-items:stretch}
  .w{flex:0 0 auto;width:100%;min-height:0}
}
/* ===== mode atur widget ===== */
.wo{display:none}
body.ed{padding-top:76px}
body.ed .wg{margin-top:0}
body.ed .w{outline:2px dashed color-mix(in srgb,var(--acc,var(--fg)) 60%,transparent);outline-offset:4px;border-radius:20px;cursor:grab;user-select:none;-webkit-user-select:none}

#ind{display:none;position:absolute;z-index:30;pointer-events:none;border-radius:3px;background:var(--acc,#4f8ef7);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc,#4f8ef7) 30%,transparent)}
#ebar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:8px 10px;max-width:calc(100vw - 24px);padding:10px 14px;border-radius:18px;background:var(--surf);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.22);font-size:13px}

</style></head><body>
