<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' alethra:; img-src * data: blob: alethra:; style-src 'self' alethra: 'unsafe-inline'">
<title>Tab baru</title><link rel="stylesheet" href="alethra://app/shared.css"><style>
:root{--bg:#fff;--surf:#f4f4f6;--fg:#111113;--sub:#6b6b73;--line:#e8e8ec}
:root[data-theme=dark]{--bg:#0b0b0d;--surf:#17171a;--fg:#f4f4f5;--sub:#8e8e96;--line:#26262a}
:root[data-theme=dark][data-amoled]{--bg:#000;--surf:#121214;--line:#1e1e21}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px 24px 32px;background-attachment:fixed}
svg{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.hero{margin-top:9vh;text-align:center}
.hero svg.logo{width:72px;height:72px;stroke-width:2.4;color:var(--acc,var(--fg))}
.hero h1{margin:10px 0 4px;font-size:34px;font-weight:700;letter-spacing:-.5px}
.hero p{margin:0;color:var(--sub);font-size:15px}
.clock{--ck:var(--fg);width:100%;max-width:560px;margin-top:28px;background:var(--surf);border-radius:26px;padding:20px 18px;text-align:center;color:var(--ck)}
.clock.nobg{background:none}
.clock .tm{font-size:calc(52px*var(--z,1));font-weight:700;letter-spacing:-1px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--ck)}
.clock .dt{margin-top:6px;font-size:calc(15px*var(--z,1));color:var(--sub)}
.clock.al-l{text-align:left}.clock.al-r{text-align:right}
.clock.analog,.clock.dial{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:18px 22px 18px 26px;border-radius:30px;min-height:calc(160px*var(--z,1))}
.clock.analog.al-c{justify-content:center;gap:34px}
.clock.analog.al-r{flex-direction:row-reverse;justify-content:space-between;text-align:right}
.clock.analog .tm{font-size:calc(34px*var(--z,1));letter-spacing:-.5px}
.clock.analog .city{margin-top:14px;font-size:calc(16px*var(--z,1));color:var(--sub)}
.clock.analog .dt{margin-top:2px;font-size:calc(16px*var(--z,1));color:var(--fg)}
.clock.dial{justify-content:center;min-height:0;padding:16px}
.clock.dial.al-l{justify-content:flex-start}.clock.dial.al-r{justify-content:flex-end}
svg.clk{width:calc(124px*var(--z,1));height:calc(124px*var(--z,1));flex:none;stroke:none;fill:none}
.clock.dial svg.clk{width:calc(170px*var(--z,1));height:calc(170px*var(--z,1))}
.clk text{fill:var(--ck);font-size:calc(12px*var(--z,1));font-weight:700;text-anchor:middle;dominant-baseline:central;font-family:system-ui,sans-serif}
.clk .h{stroke:var(--ck);stroke-linecap:round;fill:none}
.clk .t{stroke:var(--ck);stroke-linecap:round;fill:none;opacity:.55}
.clk .s{stroke:var(--acc,#f0a030);stroke-linecap:round;fill:none}
.clk circle{fill:var(--acc,#f0a030);stroke:none}
.clock.text{background:none;padding:0 4px;margin-top:24px}
.clock.text .tm{font-size:calc(30px*var(--z,1));letter-spacing:-.5px}
.clock.text .dt{margin-top:2px;font-size:calc(14px*var(--z,1))}
.clock.bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border-radius:26px;margin-top:24px}
.clock.bar.al-l{justify-content:flex-start}.clock.bar.al-r{justify-content:flex-end}
.clock.bar .tm{font-size:calc(26px*var(--z,1));letter-spacing:-.5px}
.clock.bar .dt{margin:0;font-size:calc(15px*var(--z,1))}
.grid{width:100%;max-width:640px;margin-top:34px;display:grid;grid-template-columns:repeat(5,1fr);gap:22px 12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px}
.ic{width:56px;height:56px;border-radius:16px;background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;overflow:hidden}
.ic img{width:30px;height:30px}
.ic svg{width:24px;height:24px;color:var(--fg)}
.lb{font-size:12px;color:var(--fg);max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sbox{width:100%;max-width:600px;margin-top:26px;display:flex;align-items:center;gap:10px;background:var(--surf);border:2px solid transparent;border-radius:28px;padding:0 20px;height:52px}
.sbox:focus-within{border-color:var(--acc,var(--fg))}.sbox svg{width:20px;height:20px;color:var(--sub)}
.sbox input{flex:1;height:100%;border:0;outline:0;background:none;font-size:16px;color:var(--fg)}
.tile{position:relative;cursor:pointer}.tile .rm{position:absolute;top:-6px;right:6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--surf);color:var(--sub);font-size:12px;line-height:1;display:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tile:hover .rm{display:block}.tile:hover .ic{filter:brightness(.95)}
</style></head><body>

<div class="hero">
<svg class="logo" viewBox="0 0 24 24"><path d="M4 21L12 3l8 18"/><path d="M8.2 15h7.6"/></svg>
<h1>Alethra</h1><p>Jelajahi lebih jauh.</p></div>
<form id="sf" class="sbox"><svg class="i" viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5"/></svg><input id="sq" placeholder="Cari di web atau ketik alamat" autocomplete="off" spellcheck="false"></form>
<div class="clock" id="clock"></div>
<div class="grid" id="grid"></div>
<script src="alethra://app/shared.js"></script><script src="alethra://app/pages/home.js"></script></body></html>
