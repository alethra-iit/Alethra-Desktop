<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' alethra:; img-src * data: blob:; style-src 'self' alethra: 'unsafe-inline'">
<title>Unduhan</title><link rel="stylesheet" href="alethra://app/shared.css"><style>
body{background:var(--surf)}
.page.dl{max-width:980px;padding:20px 20px 40px}
.dlc{background:var(--bg);border-radius:22px;padding:18px 22px 16px;box-shadow:0 6px 30px rgba(0,0,0,.07);border:1px solid var(--line)}
.dlh{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dlh .ico{width:48px;height:48px;border-radius:15px;background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--acc);flex:none}
.dlh .ico svg.i{width:24px;height:24px;stroke-width:2.4}
.dlh .tt{flex:1;min-width:200px}.dlh h1{margin:0;font-size:22px;letter-spacing:-.3px}.dlh .sub{margin:1px 0 0;font-size:13px}
.dlh .loc{font-size:11px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.dls{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:0 14px;height:38px;width:min(300px,100%);color:var(--sub)}
.dls input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%;font-size:13px}
.dls:focus-within{border-color:var(--acc)}
.dlt{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.tab{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 16px;border-radius:18px;border:1px solid transparent;background:var(--surf);font-size:13px;font-weight:500}
.tab:hover{background:var(--surf2)}.tab.on{background:var(--acc);color:var(--onacc)}
.tab svg.i{width:16px;height:16px}
.dll{display:flex;flex-direction:column;gap:8px;min-height:50px}
.it{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:16px;background:var(--bg);position:relative}
.it:hover{background:var(--surf)}
.it .fi{width:40px;height:44px;border-radius:11px;background:var(--surf);display:flex;align-items:center;justify-content:center;flex:none}
.it .fi .fi-svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.12))}
.it .tx{flex:1;min-width:0}.it.ok .tx{cursor:pointer}
.it .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:12px;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s .dot{width:3px;height:3px;border-radius:50%;background:currentColor;flex:none}
.it .s .st{color:var(--acc);font-weight:500}.it .s .st.bad{color:var(--danger)}.it .s .st.warn{color:#c77700}
.it .pb{height:6px;border-radius:5px;background:var(--surf2);overflow:hidden;margin-top:6px}
.it .pb i{display:block;height:100%;border-radius:6px;background:var(--acc);transition:width .25s}
.it .pb.bad i{background:var(--danger)}.it .pb.pz i{background:var(--sub)}
.it .ac{display:flex;align-items:center;flex:none}
.it .ac button{width:38px;height:34px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);color:var(--fg)}
.it .ac button:first-child{border-left:0}.it .ac button:hover{background:var(--surf2)}
.it .ac button:first-child{border-radius:12px 0 0 12px}.it .ac button:last-child{border-radius:0 12px 12px 0}
.it .ac button svg.i{width:17px;height:17px}
.mn{position:absolute;right:14px;top:calc(100% - 14px);z-index:20;min-width:200px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.mn button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;font-size:13px}
.mn button:hover{background:var(--surf)}.mn button.dg{color:var(--danger)}.mn button svg.i{width:16px;height:16px}
.dlf{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlf .cn{display:flex;align-items:center;gap:10px;font-size:13px}
.dlf .ck{width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center}
.dlf .ck svg.i{width:15px;height:15px;stroke-width:3}
.dlf .btn{height:34px;border-radius:18px;padding:0 18px;font-size:13px;font-weight:500}
.dlf .btn:disabled{opacity:.45;cursor:default}
@media(max-width:700px){.dlc{padding:14px}.it{flex-wrap:wrap}.it .ac{margin-left:auto}}
</style></head><body><div class="page dl" id="app"></div>
<script src="alethra://app/shared.js"></script><script src="alethra://app/fileicons.js"></script><script src="alethra://app/pages/downloads.js"></script></body></html>
