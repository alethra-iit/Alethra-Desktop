<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' alethra:; img-src * data: blob:; media-src alethra: blob:; style-src 'self' alethra: 'unsafe-inline'">
<title>AlethPlay</title><link rel="stylesheet" href="alethra://app/shared.css"><style>
html,body{height:100%;overflow:hidden}
[hidden]{display:none!important}
.ap{display:grid;grid-template-columns:184px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;height:100vh;background:var(--bg)}
/* sidebar */
.sb{grid-row:1;padding:14px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;overflow:auto}
.sb .lg{display:flex;align-items:center;gap:8px;padding:2px 10px 14px;font-weight:700;font-size:15px;letter-spacing:-.2px}
.nv{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border:0;border-radius:10px;background:none;text-align:left;color:var(--sub)}
.nv:hover{background:var(--surf);color:var(--fg)}.nv.on{background:var(--surf2);color:var(--fg);font-weight:600}
.nv svg.i{width:18px;height:18px}
/* konten */
.mn{grid-row:1;grid-column:2;min-width:0;min-height:0;position:relative;display:flex;flex-direction:column}
.view{flex:1;min-height:0;overflow:auto;padding:20px 24px 28px}
.view[hidden]{display:none}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hd h1{margin:0;font-size:22px;letter-spacing:-.3px}.hd .sub{margin:2px 0 0;font-size:13px;color:var(--sub)}
.hd .ex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tb .search{height:36px;max-width:340px}
.btn svg.i{width:16px;height:16px}
.back{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--sub);margin:-4px 0 8px -8px}
.back:hover{background:var(--surf);color:var(--fg)}.back svg.i{width:16px;height:16px}
/* baris item */
.lst{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:10px;min-height:52px;position:relative;cursor:pointer}
.it:hover,.it.menu{background:var(--surf)}.it.now{background:var(--surf2)}
.it.miss{opacity:.5;cursor:default}
.it .ic{width:36px;height:36px;border-radius:9px;background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
.it.now .ic{background:var(--acc);color:var(--onacc)}
.it .tx{flex:1;min-width:0}.it .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}.it.now .t{font-weight:700}
.it .s{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .acts{display:flex;gap:2px;opacity:0}.it:hover .acts,.it:focus-within .acts,.it.menu .acts{opacity:1}
.more{width:100%;margin-top:10px;justify-content:center}
.empty{padding:56px 16px;text-align:center;color:var(--sub);line-height:1.6}
.empty .btn{margin-top:10px}
/* tombol pilih tampilan: daftar / gambar */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surf)}
.seg button{width:38px;height:36px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--sub)}
.seg button:hover{color:var(--fg)}.seg button.on{background:var(--acc);color:var(--onacc)}.seg svg.i{width:17px;height:17px}
/* ikon baris (mode daftar) — di mode gambar .ic menjadi kotak gambar */
.it .ic .ico{display:flex}.it .ic .ico svg.i{width:18px;height:18px}
.it .ic .th,.it .ic .dfl{display:none}
/* tampilan daftar gambar */
.lst.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px 14px;align-items:start}
.lst.grid.wide{grid-template-columns:repeat(auto-fill,minmax(224px,1fr))}
.lst.grid .empty,.lst.grid .more{grid-column:1/-1}
.lst.grid .it{flex-direction:column;align-items:stretch;gap:8px;padding:8px 8px 10px;min-height:0;border-radius:14px}
.lst.grid .it.now{background:var(--surf2);box-shadow:inset 0 0 0 2px var(--acc)}
.lst.grid .it .ic{width:100%;height:auto;aspect-ratio:1/1;border-radius:10px;position:relative;overflow:hidden}
.lst.grid.wide .it .ic{aspect-ratio:16/9}
.lst.grid .it.now .ic{background:var(--surf);color:var(--sub)}
.lst.grid .it .ic>svg.i{width:42%;height:42%;max-width:56px;max-height:56px;stroke-width:1.4}
.lst.grid .it .ic .dfl{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--surf2),var(--surf));color:var(--sub)}
.lst.grid .it .ic .dfl svg.i{width:42%;height:42%;max-width:64px;max-height:64px;stroke-width:1.4}
.lst.grid .it .ic .th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lst.grid .it .ic.has .th{display:block}.lst.grid .it .ic.has .dfl{display:none}
.lst.grid .it .ic .ico{position:absolute;left:6px;bottom:6px;z-index:1;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;align-items:center;justify-content:center}
.lst.grid .it .ic .ico svg.i{width:12px;height:12px}
.lst.grid .it .tx{flex:none;width:100%;padding:0 2px}
.lst.grid .it .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3;font-size:13px;min-height:2.6em}
.lst.grid .it .acts{position:absolute;top:12px;right:12px;z-index:2;background:rgba(0,0,0,.6);border-radius:9px;color:#fff}
.lst.grid .it .acts .ib:hover{background:rgba(255,255,255,.22)}
/* sedang diputar */
#np{display:flex;gap:20px;padding:20px 24px}
#np .col{flex:1;min-width:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:200px;border-radius:14px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#v{width:100%;height:100%;max-height:100%;background:#000;display:block;outline:0}
#np[data-k=a] #v{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.art{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--surf);color:var(--sub);padding:20px;text-align:center}
#np[data-k=a] .art{display:flex}
.art svg.i{width:72px;height:72px;stroke-width:1.2}
.art .an{font-size:20px;font-weight:700;color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.err{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--surf);color:var(--danger);font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.err[hidden]{display:none}
.q{width:320px;flex:none;display:flex;flex-direction:column;min-height:0}
.q .qh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.q .qh b{font-size:14px}
.q .lst{overflow:auto;min-height:0;flex:1}
.q .it{min-height:46px}.q .it .ic{width:30px;height:30px}
#npEmpty[hidden],#npMain[hidden]{display:none}
/* pemutar */
.pl{grid-column:1/-1;border-top:1px solid var(--line);background:var(--bg);padding:8px 20px 10px;display:flex;flex-direction:column;gap:4px}
.pr{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.pr input{flex:1}.pr span{min-width:40px}.pr span:first-child{text-align:right}
.pc{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.pc .nm{min-width:0;cursor:pointer}.pc .nm .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc .nm .s{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .mid{display:flex;align-items:center;gap:6px}
.pc .rt{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.cb{width:36px;height:36px;border:0;border-radius:50%;background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);position:relative}
.cb:hover{background:var(--surf2)}.cb:disabled{opacity:.35;pointer-events:none}
.cb.on{color:var(--acc)}.cb.on:after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:currentColor}
.cb svg.i{width:19px;height:19px}.cb svg.f{fill:currentColor}
.cb.big{width:46px;height:46px;background:var(--acc);color:var(--onacc)}.cb.big:hover{background:var(--acc);opacity:.88}.cb.big svg.i{width:22px;height:22px}
.vol{width:88px}
input[type=range]{-webkit-appearance:none;appearance:none;height:16px;background:transparent;margin:0;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--acc) var(--p),var(--surf2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);margin-top:-4px;border:0}
input[type=range]:disabled{opacity:.4;cursor:default}
/* menu & toast */
.pm{position:fixed;z-index:60;min-width:210px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;max-height:60vh;overflow:auto}
.pm button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;font-size:13px;white-space:nowrap}
.pm button:hover{background:var(--surf)}.pm button.dg{color:var(--danger)}.pm hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.pm .hh{padding:4px 10px;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:18px;font-size:13px;z-index:70;opacity:0;pointer-events:none;transition:opacity .15s;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
/* layar penuh (video) */
body.fs .ap{display:block}body.fs .sb,body.fs .q,body.fs .view:not(#np){display:none}
body.fs #np{padding:0;position:fixed;inset:0;background:#000}body.fs .stage{border-radius:0}body.fs .err{display:none}
body.fs .pl{position:fixed;left:0;right:0;bottom:0;border:0;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff;--fg:#fff;--sub:#c9c9cf;--surf2:rgba(255,255,255,.28);--acc:#fff;--onacc:#111;padding-top:28px;transition:opacity .2s}
body.fs.idle .pl{opacity:0;pointer-events:none}body.fs.idle{cursor:none}
@media(max-width:900px){#np{flex-direction:column}.q{width:auto;max-height:36%}}
@media(max-width:760px){.lst.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.lst.grid.wide{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.ap{grid-template-columns:56px minmax(0,1fr)}.nv{justify-content:center;padding:0}.nv span,.sb .lg span{display:none}.sb .lg{justify-content:center;padding:2px 0 12px}.vol{display:none}.view{padding:16px}.pl{padding:8px 12px}}
</style></head><body><div class="ap" id="ap"></div><div id="toast"></div>
<script src="alethra://app/shared.js"></script><script src="alethra://app/pages/play.js"></script></body></html>
