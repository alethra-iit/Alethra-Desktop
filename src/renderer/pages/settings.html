<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' alethra:; img-src * data: blob:; style-src 'self' alethra: 'unsafe-inline'">
<title>Pengaturan</title><link rel="stylesheet" href="alethra://app/shared.css">
<style>
.wrap{display:flex;min-height:100vh}.side{width:230px;flex:none;padding:24px 12px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
.side h2{margin:0 12px 16px;font-size:20px}.side button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 12px;border:0;background:none;border-radius:10px;text-align:left}.side button:hover{background:var(--surf)}.side button.on{background:var(--acc);color:var(--onacc)}
.main{flex:1;min-width:0;padding:26px 32px 80px;max-width:820px}
.main h1{margin:0 0 18px;font-size:24px}
.set{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}.set:last-child{border-bottom:0}.set .tx{flex:1;min-width:0}.set .d{color:var(--sub);font-size:12.5px}
.sws{display:flex;gap:8px;flex-wrap:wrap}.swc{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.swc.on{outline:2px solid var(--fg);outline-offset:2px}
.acc{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}.acch{display:flex;width:100%;align-items:center;gap:12px;padding:14px 16px;border:0;background:var(--surf);color:inherit;text-align:left;cursor:pointer}.acch:hover{background:var(--surf2)}.acch .tx{flex:1;min-width:0}.acch .d{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}.acch .chv{display:flex;transition:transform .15s}.acc.open .chv{transform:rotate(180deg)}.acc .list{border:0;border-radius:0;margin:0}.acc:not(.open) .list{display:none}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}
</style></head><body><div class="wrap"><nav class="side" id="side"></nav><div class="main" id="main"></div></div>
<script src="alethra://app/shared.js"></script><script src="alethra://app/pages/settings.js"></script></body></html>
