name: Build EXE (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # tanpa tanda tangan kode
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Pasang dependensi
        run: npm install --no-audit --no-fund

      - name: Cek sintaks
        run: node scripts/check.js

      - name: Build installer + portable
        run: npx electron-builder --win --x64 --publish never --config.extraMetadata.version=1.0.${{ github.run_number }}

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: Alethra-Windows
          path: |
            dist/Alethra-Setup-*.exe
            dist/Alethra-Portable-*.exe
          if-no-files-found: error

      - name: Rilis di GitHub
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Alethra v1.0.${{ github.run_number }}
          files: |
            dist/Alethra-Setup-*.exe
            dist/Alethra-Portable-*.exe
