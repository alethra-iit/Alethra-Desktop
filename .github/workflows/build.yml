name: Build EXE (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # Tanda tangan kode aktif otomatis bila secret WIN_CSC_LINK (.pfx base64) dan WIN_CSC_KEY_PASSWORD diisi; bila kosong, build tidak ditandatangani.
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CSC_LINK != '' && 'true' || 'false' }}
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Pasang dependensi
        run: npm install --no-audit --no-fund

      - name: Cek sintaks
        run: node scripts/check.js

      - name: Info penandatanganan
        shell: bash
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then echo "Build ditandatangani (sertifikat dari secret)."; else echo "::notice::Build TIDAK ditandatangani (secret WIN_CSC_LINK kosong). SmartScreen akan menampilkan peringatan."; fi

      - name: Build installer + portable
        # publish.* hanya membuat latest.yml + app-update.yml untuk pembaruan otomatis (--publish never: unggahan dilakukan langkah "Rilis di GitHub").
        # alethraRepo dibaca aplikasi untuk mengecek rilis terbaru (dipakai juga oleh versi portable).
        run: >
          npx electron-builder --win --x64 --publish never
          --config.extraMetadata.version=1.0.${{ github.run_number }}
          --config.extraMetadata.alethraRepo=${{ github.repository }}
          --config.publish.provider=github
          --config.publish.owner=${{ github.repository_owner }}
          --config.publish.repo=${{ github.event.repository.name }}

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: Alethra-Windows
          path: |
            dist/Alethra-Setup-*.exe
            dist/Alethra-Setup-*.exe.blockmap
            dist/Alethra-Portable-*.exe
            dist/latest.yml
          if-no-files-found: error

      - name: Rilis di GitHub
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Alethra v1.0.${{ github.run_number }}
          make_latest: true
          # latest.yml + .blockmap WAJIB ikut: dari sinilah pembaruan otomatis membaca versi terbaru dan mengunduh selisihnya
          files: |
            dist/Alethra-Setup-*.exe
            dist/Alethra-Setup-*.exe.blockmap
            dist/Alethra-Portable-*.exe
            dist/latest.yml
